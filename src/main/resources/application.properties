server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,org.vaadin.demo

# H2 in-memory database, filled by SeedData on startup
spring.datasource.url=jdbc:h2:mem:expenses
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Spring AI is on the classpath from the start; without a key the app still boots (AI features come in phase 2)
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
# draiv-ai pulls in the Mistral and Anthropic starters too. Their models need a non-blank key to be
# created at startup, so they get placeholders. We only use OpenAI.
spring.ai.mistralai.api-key=not-configured
spring.ai.anthropic.api-key=not-configured
